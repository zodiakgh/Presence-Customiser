name: Release

# Push a tag (e.g. v1.0.0) and the exe is built and added automatically
# to the repository's Releases page, which is what the "Download Presence Customiser" button points to.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Engine tests
        run: python tests/test_engine.py

      - name: Build the exe
        run: >
          python -m PyInstaller --noconsole --onefile --name PresenceCustomiser
          --collect-all customtkinter --collect-all pypresence
          --hidden-import pystray._win32 main.py

      - name: Publish to Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PresenceCustomiser.exe
          generate_release_notes: true

      - name: Keep the exe as an artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: PresenceCustomiser
          path: dist/PresenceCustomiser.exe
