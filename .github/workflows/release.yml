name: Release

# Pousse un tag (ex : v1.0.0) et l'exe est construit puis ajouté automatiquement
# à la page Releases du dépôt, c'est ce que télécharge le bouton « Download Presence Customiser ».
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Tests du moteur
        run: python tests/test_engine.py

      - name: Construire l'exe
        run: >
          python -m PyInstaller --noconsole --onefile --name PresenceCustomiser
          --collect-all customtkinter --collect-all pypresence
          --hidden-import pystray._win32 main.py

      - name: Publier dans les Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PresenceCustomiser.exe
          generate_release_notes: true

      - name: Garder l'exe en artefact (lancement manuel)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: PresenceCustomiser
          path: dist/PresenceCustomiser.exe
